<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#121212">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Google Переводчик</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      color: #e3e2e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .header {
      padding: 14px 16px;
      background-color: #121212;
      display: flex;
      align-items: center;
    }

    .header-title {
      font-size: 20px;
      color: #e3e2e6;
      cursor: pointer;
      user-select: none;
    }

    .header-title span {
      color: #a8c7fa;
      font-weight: 500;
    }

    .language-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e1e1e;
      margin: 4px 16px 8px 16px;
      padding: 6px 12px;
      border-radius: 28px;
      border: 1px solid #333538;
    }

    .lang-btn {
      background: none;
      border: none;
      color: #a8c7fa;
      font-size: 15px;
      font-weight: 500;
      padding: 8px 16px;
    }

    .swap-btn {
      background: none;
      border: none;
      color: #c4c6d0;
      font-size: 18px;
    }

    .api-key-container {
      padding: 0 16px 8px 16px;
    }

    .api-key-input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333538;
      border-radius: 12px;
      padding: 10px 14px;
      color: #c4c6d0;
      font-size: 13px;
      outline: none;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 16px 16px;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #2b2d30;
    }

    .card-header {
      font-size: 12px;
      color: #8e9196;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: none;
      border: none;
      color: #e3e2e6;
      font-size: 17px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: #8e9196;
    }

    .clear-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2b2d30;
      border: none;
      color: #c4c6d0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .output-text {
      font-size: 17px;
      line-height: 1.4;
      color: #a8c7fa;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .subtle-answer {
      font-size: 14px;
      color: #2a2b2d;
      margin-top: 15px;
      font-weight: 700;
      user-select: none;
      text-align: right;
    }

    .action-btn {
      background-color: #a8c7fa;
      color: #003062;
      border: none;
      padding: 14px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .action-btn:disabled {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title" id="secretTitle">Google <span>Переводчик</span></div>
  </div>

  <div class="language-selector">
    <button class="lang-btn">Английский</button>
    <button class="swap-btn">⇄</button>
    <button class="lang-btn">Русский</button>
  </div>

  <div class="api-key-container" id="apiContainer">
    <input type="password" id="apiKey" class="api-key-input" placeholder="Gemini API Key...">
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">Английский</div>
      <button class="clear-btn" id="clearBtn">×</button>
      <textarea id="inputText" placeholder="Введите текст или тестовый вопрос..."></textarea>
      <button class="action-btn" id="translateBtn">
        <span id="btnText">Перевести</span>
      </button>
    </div>

    <div class="card">
      <div class="card-header">Перевод (Русский)</div>
      <div id="outputText" class="output-text">Здесь появится перевод...</div>
      <div id="subtleAnswer" class="subtle-answer"></div>
    </div>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const subtleAnswer = document.getElementById('subtleAnswer');
    const clearBtn = document.getElementById('clearBtn');
    const translateBtn = document.getElementById('translateBtn');
    const btnText = document.getElementById('btnText');
    const apiKeyInput = document.getElementById('apiKey');
    const apiContainer = document.getElementById('apiContainer');
    const secretTitle = document.getElementById('secretTitle');

    const API_BASE = 'https://generativelanguage.googleapis.com/v1beta';

    const MODELS = [
      { id: 'gemini-3.5-flash-lite' },
      { id: 'gemini-3.8-flash', thinking: 'low' },
      { id: 'gemini-3.1-flash-lite' }
    ];

    const SYSTEM_PROMPT =
      'You are an expert translator. ' +
      '1. Translate the user text to Russian, keeping the original formatting. ' +
      '2. If the text contains a multiple-choice question, find the correct option letter. ' +
      '3. Respond STRICTLY in JSON format: {"translation": "Текст на русском", "correct_option": "A" (или null если это не тест)}.';

    function storageGet(key) {
      try { return localStorage.getItem(key); } catch { return null; }
    }

    function storageSet(key, value) {
      try { localStorage.setItem(key, value); } catch { }
    }

    if (storageGet('gemini_api_key')) {
      apiKeyInput.value = storageGet('gemini_api_key');
      apiContainer.style.display = 'none';
    }

    apiKeyInput.addEventListener('input', () => storageSet('gemini_api_key', apiKeyInput.value.trim()));

    secretTitle.addEventListener('click', () => {
      apiContainer.style.display = apiContainer.style.display === 'none' ? 'block' : 'none';
    });

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      outputText.innerText = 'Здесь появится перевод...';
      subtleAnswer.innerText = '';
      inputText.focus();
    });

    async function sendQuery(modelObj, text, apiKey) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 6000);

      const body = {
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents: [{ role: 'user', parts: [{ text }] }],
        generationConfig: {
          responseMimeType: "application/json",
          temperature: 0.1
        }
      };

      if (modelObj.thinking) {
        body.generationConfig.thinkingConfig = { thinkingLevel: modelObj.thinking };
      }

      try {
        const res = await fetch(`${API_BASE}/models/${modelObj.id}:generateContent?key=${encodeURIComponent(apiKey)}`, {
          method: 'POST',
          signal: controller.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        clearTimeout(timer);
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          const msg = data?.error?.message || res.statusText || 'Неизвестная ошибка';
          throw new Error(`HTTP ${res.status}: ${msg}`);
        }

        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (!raw) throw new Error('Пустой ответ от модели');

        return JSON.parse(raw);
      } catch (err) {
        clearTimeout(timer);
        if (err.name === 'AbortError') {
          throw new Error('Превышено время ожидания (6 сек). Проверьте интернет.');
        }
        throw err;
      }
    }

    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;
      if (!apiKey) {
        alert('Введите ключ API!');
        apiContainer.style.display = 'block';
        return;
      }

      btnText.innerText = 'Обработка...';
      translateBtn.disabled = true;
      subtleAnswer.innerText = '';

      let lastErr = null;

      for (const model of MODELS) {
        try {
          const result = await sendQuery(model, text, apiKey);
          outputText.innerText = result.translation || 'Перевод отсутствует';

          if (result.correct_option && result.correct_option !== 'null') {
            subtleAnswer.innerText = String(result.correct_option).toUpperCase();
          }

          lastErr = null;
          break;
        } catch (err) {
          lastErr = err;
          if (/400|401|403|429/.test(err.message)) {
            break;
          }
        }
      }

      if (lastErr) {
        outputText.innerText = `Ошибка: ${lastErr.message}`;
        if (/400|401|403|429/.test(lastErr.message)) {
          apiContainer.style.display = 'block';
        }
      }

      btnText.innerText = 'Перевести';
      translateBtn.disabled = false;
    });
  </script>
</body>
</html>
