<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Google Переводчик</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #121212;
      color: #e3e2e6;
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100vw;
      overflow-x: hidden;
    }

    .header {
      padding: 14px 16px;
      background-color: #121212;
      display: flex;
      align-items: center;
    }

    .header-title {
      font-size: 20px;
      color: #e3e2e6;
    }

    .header-title span {
      color: #a8c7fa;
      font-weight: 500;
    }

    .language-selector {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #1e1e1e;
      margin: 4px 16px 8px 16px;
      padding: 6px 12px;
      border-radius: 28px;
      border: 1px solid #333538;
    }

    .lang-btn {
      background: none;
      border: none;
      color: #a8c7fa;
      font-size: 15px;
      font-weight: 500;
      padding: 8px 16px;
    }

    .swap-btn {
      background: none;
      border: none;
      color: #c4c6d0;
      font-size: 18px;
    }

    .api-key-container {
      padding: 0 16px 8px 16px;
    }

    .api-key-input {
      width: 100%;
      background: #1e1e1e;
      border: 1px solid #333538;
      border-radius: 12px;
      padding: 10px 14px;
      color: #c4c6d0;
      font-size: 13px;
      outline: none;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0 16px 16px 16px;
      gap: 12px;
      overflow-y: auto;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 24px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 1px solid #2b2d30;
    }

    .card-header {
      font-size: 12px;
      color: #8e9196;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    textarea {
      width: 100%;
      height: 130px;
      background: none;
      border: none;
      color: #e3e2e6;
      font-size: 17px;
      line-height: 1.4;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: #8e9196;
    }

    .clear-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2b2d30;
      border: none;
      color: #c4c6d0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }

    .output-text {
      font-size: 17px;
      line-height: 1.4;
      color: #a8c7fa;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .answer-card {
      background-color: #004a77;
      border: 1px solid #00639b;
      border-radius: 20px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .answer-label {
      font-size: 14px;
      color: #c2e7ff;
      font-weight: 500;
    }

    .answer-value {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      background-color: #00639b;
      padding: 4px 16px;
      border-radius: 12px;
      min-width: 44px;
      text-align: center;
    }

    .action-btn {
      background-color: #a8c7fa;
      color: #003062;
      border: none;
      padding: 14px;
      border-radius: 100px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    .action-btn:disabled {
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">Google <span>Переводчик</span></div>
  </div>

  <div class="language-selector">
    <button class="lang-btn">Английский</button>
    <button class="swap-btn">⇄</button>
    <button class="lang-btn">Русский</button>
  </div>

  <div class="api-key-container">
    <input type="password" id="apiKey" class="api-key-input" placeholder="Gemini API Key...">
  </div>

  <div class="content">
    <div class="card">
      <div class="card-header">Английский</div>
      <button class="clear-btn" id="clearBtn">×</button>
      <textarea id="inputText" placeholder="Введите текст или тестовый вопрос..."></textarea>
      <button class="action-btn" id="translateBtn">
        <span id="btnText">Перевести</span>
      </button>
    </div>

    <div class="card">
      <div class="card-header">Перевод (Русский)</div>
      <div id="outputText" class="output-text">Здесь появится перевод...</div>
    </div>

    <div class="answer-card" id="answerCard" style="display: none;">
      <span class="answer-label">Правильный вариант (Java AI):</span>
      <span class="answer-value" id="answerValue">-</span>
    </div>
  </div>

  <script>
    const inputText = document.getElementById('inputText');
    const outputText = document.getElementById('outputText');
    const answerCard = document.getElementById('answerCard');
    const answerValue = document.getElementById('answerValue');
    const clearBtn = document.getElementById('clearBtn');
    const translateBtn = document.getElementById('translateBtn');
    const btnText = document.getElementById('btnText');
    const apiKeyInput = document.getElementById('apiKey');

    if (localStorage.getItem('gemini_api_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_api_key');
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
    });

    clearBtn.addEventListener('click', () => {
      inputText.value = '';
      outputText.innerText = 'Здесь появится перевод...';
      answerCard.style.display = 'none';
      inputText.focus();
    });

    translateBtn.addEventListener('click', async () => {
      const text = inputText.value.trim();
      const apiKey = apiKeyInput.value.trim();

      if (!text) return;
      if (!apiKey) {
        alert('Введите Gemini API Key в поле сверху!');
        return;
      }

      btnText.innerText = 'Обработка...';
      translateBtn.disabled = true;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `You are an expert translator and senior Java developer.
Analyze the user input text.
Tasks:
1. Translate the entire English text to natural Russian. Keep original formatting.
2. Check if the text contains a test question with options (e.g. A, B, C, D, E, F).
3. If it is a Java or general multiple-choice question, evaluate it accurately and choose the correct single option letter.
4. Respond ONLY with a valid raw JSON object, without markdown code fences or extra text:
{
  "translation": "текст перевода на русский",
  "has_question": true/false,
  "correct_option": "буква (например A) или null"
}

Input:
${text}`
              }]
            }]
          })
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(`Ошибка HTTP ${response.status}: ${errData.error?.message || response.statusText}`);
        }

        const data = await response.json();
        const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        
        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('Не удалось разобрать ответ от ИИ.');

        const result = JSON.parse(jsonMatch[0]);

        outputText.innerText = result.translation;

        if (result.has_question && result.correct_option) {
          answerValue.innerText = String(result.correct_option).toUpperCase();
          answerCard.style.display = 'flex';
        } else {
          answerCard.style.display = 'none';
        }

      } catch (err) {
        outputText.innerText = ` Ошибка: ${err.message}`;
        console.error(err);
      } finally {
        btnText.innerText = 'Перевести';
        translateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
